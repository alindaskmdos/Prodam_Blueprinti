[versions]
spring-boot = "3.3.5"
javaparser = "3.26.2"
junit = "5.11.3"
# JUnit Platform идёт в паре с Jupiter: 5.x.y ↔ 1.x.y
junit-platform = "1.11.3"
jackson = "2.17.2"
picocli = "4.7.6"
pmd = "7.28.0"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
javaparser-symbol-solver = { module = "com.github.javaparser:javaparser-symbol-solver-core", version.ref = "javaparser" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
pmd-java = { module = "net.sourceforge.pmd:pmd-java", version.ref = "pmd" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version = "1.4.0" }
junit-platform-console-standalone = { module = "org.junit.platform:junit-platform-console-standalone", version.ref = "junit-platform" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
